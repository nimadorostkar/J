<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060A14" />
    <title>You're offline — Houston</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #060A14;
        color: #fff;
        font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      img { width: 96px; height: 96px; border-radius: 22%; }
      h1 { font-size: 20px; font-weight: 600; margin: 18px 0 6px; }
      p { font-size: 14px; line-height: 1.45; color: #94a3b8; max-width: 320px; margin: 0; }
      button {
        margin-top: 22px;
        height: 44px;
        padding: 0 22px;
        border-radius: 9999px;
        border: 0;
        background: #2DD4BF;
        color: #060A14;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 0 18px rgba(45, 212, 191, 0.45);
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <img src="/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>We couldn't reach Houston. Check your connection and try again — your data is safe and waiting.</p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
