# === FILE: backend/docker-compose.yml ===

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tokenvault
      POSTGRES_USER: tokenvault
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenvault -d tokenvault"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  django:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles
      - mediafiles:/app/media
    ports:
      - "8000:8000"
    expose:
      - "8000"
    restart: unless-stopped

  daphne:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["daphne", "-b", "0.0.0.0", "-p", "9000", "core.asgi:application"]
    expose:
      - "9000"
    # Override the Dockerfile HEALTHCHECK (which points at :8000)
    # since daphne listens on :9000 instead.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/v1/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "core", "worker", "--loglevel=info", "--concurrency=4"]
    # Celery has no HTTP endpoint — ask the broker if the worker is alive.
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "core", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    # Beat has no HTTP endpoint and no celery-inspect equivalent. The
    # slim base image also doesn't ship procps (no pgrep). Disable the
    # inherited HEALTHCHECK; restart:unless-stopped covers crashes.
    healthcheck:
      disable: true
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - django
      - daphne
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/app/staticfiles:ro
      - mediafiles:/app/media:ro
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  staticfiles:
  mediafiles:
